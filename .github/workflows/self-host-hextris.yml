name: Self-host Hextris
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/self-host-hextris.yml"
      - "scripts/self-host-hextris.sh"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: self-host-hextris
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out arcade
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Mirror, clean and register Hextris
        run: bash scripts/self-host-hextris.sh
