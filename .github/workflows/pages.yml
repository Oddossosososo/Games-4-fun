name: Build and deploy Afterglow games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Afterglow
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p public/games
          cp index.html public/index.html

      - name: Discover every GitHub game repository in the catalogue
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const section = html.match(/const GAMES\s*=\s*\[([\s\S]*?)\n\];/);
          if (!section) throw new Error('Could not read the GAMES catalogue');
          const entries = [];
          for (const match of section[1].matchAll(/\{([\s\S]*?)\}/g)) {
            const item = match[1];
            const id = item.match(/\bid\s*:\s*"([^"]+)"/)?.[1];
            const repo = item.match(/\brepo\s*:\s*"([^"]*)"/)?.[1];
            const entry = item.match(/\bentry\s*:\s*"([^"]+)"/)?.[1] || "";
            if (id && repo) {
              const github = repo.match(/^https?:\/\/github\.com\/([^/]+\/[^/]+?)(?:\.git)?\/?$/i);
              if (github) entries.push({ id, repo: github[1], entry });
            }
          }
          const unique = [...new Map(entries.map(x => [x.repo.toLowerCase(), x])).values()];
          fs.writeFileSync('/tmp/afterglow-repositories.json', JSON.stringify({ entries, unique }, null, 2));
          console.log('Found ' + entries.length + ' catalogue entries pointing to ' + unique.length + ' GitHub repositories.');
          NODE

      - name: Clone every catalogue repository with a verified open-source licence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public/games
          echo '# Afterglow game sources' > public/SOURCES.md
          echo '' >> public/SOURCES.md
          echo 'Repositories are discovered from the live game catalogue at build time. A repository is copied only when GitHub reports an approved redistributable SPDX licence. Upstream files and licence notices are preserved.' >> public/SOURCES.md
          echo '' >> public/SOURCES.md

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/afterglow-repositories.json', 'utf8'));
          fs.writeFileSync('/tmp/afterglow-unique-repos.tsv',
            data.unique.map(x => x.repo).join('\n') + '\n');
          NODE

          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            api="https://api.github.com/repos/$repo"
            metadata="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "$api")" || {
              echo "Skipping $repo: repository metadata unavailable"
              continue
            }
            licence="$(printf '%s' "$metadata" | jq -r '.license.spdx_id // "NOASSERTION"')"
            case "$licence" in
              MIT|Apache-2.0|GPL-2.0|GPL-2.0-only|GPL-2.0-or-later|GPL-3.0|GPL-3.0-only|GPL-3.0-or-later|AGPL-3.0|AGPL-3.0-only|AGPL-3.0-or-later|MPL-2.0|Unlicense|BSD-2-Clause|BSD-3-Clause|ISC)
                ;;
              *)
                echo "Skipping $repo: licence '$licence' is not on the approved redistribution list"
                continue
                ;;
            esac

            folder="$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]' | tr '/' '-')"
            echo "Cloning $repo ($licence)"
            git clone --depth 1 "https://github.com/$repo.git" "public/games/$folder"
            rm -rf "public/games/$folder/.git"
            printf '\n- %s — https://github.com/%s — %s (games/%s/)\n' "$repo" "$repo" "$licence" "$folder" >> public/SOURCES.md
          done < /tmp/afterglow-unique-repos.tsv

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const data = JSON.parse(fs.readFileSync('/tmp/afterglow-repositories.json', 'utf8'));
          const map = {};
          const root = path.resolve('public');
          const safeHtml = rel => {
            if (!rel || path.isAbsolute(rel) || rel.split(/[\\/]/).includes('..')) return false;
            const full = path.resolve(root, rel);
            return full.startsWith(root + path.sep) && fs.existsSync(full) &&
              fs.statSync(full).isFile() && full.toLowerCase().endsWith('.html');
          };
          const findIndexes = (dir, rel = '') => {
            let found = [];
            if (!fs.existsSync(dir)) return found;
            for (const ent of fs.readdirSync(dir, {withFileTypes:true})) {
              if (ent.name === '.git' || ent.name === 'node_modules' || ent.name.startsWith('.')) continue;
              const child = path.join(dir, ent.name);
              const childRel = path.posix.join(rel, ent.name);
              if (ent.isDirectory()) found = found.concat(findIndexes(child, childRel));
              else if (ent.isFile() && ent.name.toLowerCase() === 'index.html') found.push(childRel);
            }
            return found;
          };
          for (const entry of data.entries) {
            const folder = entry.repo.toLowerCase().replaceAll('/', '-');
            const base = path.join(root, 'games', folder);
            if (!fs.existsSync(base)) continue;
            let chosen = '';
            if (entry.entry && safeHtml(path.posix.join('games', folder, entry.entry))) chosen = entry.entry;
            else if (!entry.entry) {
              const indexes = findIndexes(base);
              if (indexes.length === 1) chosen = indexes[0];
              else {
                for (const common of ['index.html', 'dist/index.html', 'build/index.html', 'public/index.html']) {
                  if (safeHtml(path.posix.join('games', folder, common))) { chosen = common; break; }
                }
              }
            }
            if (chosen) {
              map[entry.id] = './games/' + folder + '/' + chosen.split(path.sep).join('/');
              console.log('Local cloned game: ' + entry.id + ' -> ' + map[entry.id]);
            } else console.log('No unambiguous static entrypoint for ' + entry.id + '; not playable in clone-only mode.');
          }
          fs.writeFileSync('public/GAME-SOURCES.json', JSON.stringify(map, null, 2));
          NODE

          echo '' >> public/SOURCES.md
          echo 'Games without a GitHub repository or with an unverified/non-approved licence remain external and are not copied.' >> public/SOURCES.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
