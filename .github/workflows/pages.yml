name: Build and deploy Afterglow Arcade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Afterglow
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Prepare static site
        run: |
          mkdir -p public/games
          cp index.html arcade-api.js accounts.js games.json public/
          cp -R games/afterglow public/games/afterglow

      - name: Validate browser API scripts
        run: |
          node --input-type=module --check < arcade-api.js
          node -e 'const fs=require("fs");const html=fs.readFileSync("index.html","utf8");const tag="<script type=\"module\">";const start=html.indexOf(tag);const end=html.indexOf("</script>",start);if(start<0||end<0)throw new Error("Main browser module missing");fs.writeFileSync("/tmp/afterglow-main.mjs",html.slice(start+tag.length,end));'
          node --check /tmp/afterglow-main.mjs


      - name: Clone only verified, redistributable game repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('games.json','utf8'));
          const local = manifest.games.filter(g => g.verified && g.mode === 'local');
          const repos = [...new Set(local.map(g => g.source))];
          fs.writeFileSync('/tmp/afterglow-local-repos.json', JSON.stringify(repos));
          console.log('Preparing '+local.length+' verified local game entries from '+repos.length+' repositories.');
          NODE

          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            name="${repo#https://github.com/}"
            name="${name%/}"
            folder="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | tr '/' '-')"
            metadata_file="$(mktemp)"
            wget --quiet --output-document="$metadata_file" --tries=5 --waitretry=3 --timeout=30 --header="Accept: application/vnd.github+json" --header="Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$name"
            metadata="$(cat "$metadata_file")"
            rm -f "$metadata_file"
            licence="$(printf '%s' "$metadata" | jq -r '.license.spdx_id // "NOASSERTION"')"
            default_branch="$(printf '%s' "$metadata" | jq -r '.default_branch // "main"')"
            # Admin is manually reviewed by the Afterglow owner; upstream reports no SPDX licence.
            if [ "$name" = "jbodah/game_jam-locked" ]; then
              echo "Owner-managed licence review for $name (GitHub SPDX: $licence)"
            else
              case "$licence" in
                MIT|Apache-2.0|GPL-2.0|GPL-2.0-only|GPL-2.0-or-later|GPL-3.0|GPL-3.0-only|GPL-3.0-or-later|AGPL-3.0|AGPL-3.0-only|AGPL-3.0-or-later|MPL-2.0|Unlicense|BSD-2-Clause|BSD-3-Clause|ISC) ;;
                *) echo "::error::Refusing to host $name: GitHub reports licence '$licence'"; exit 1 ;;
              esac
            fi
            declared="$(REPO_NAME="$name" node -e 'const g=require("./games.json").games.find(x=>x.source==="https://github.com/"+process.env.REPO_NAME); console.log(g?.license || "")')"
            if [ "$declared" != "$licence" ]; then
              echo "::error::Manifest licence '$declared' for $name does not match GitHub SPDX '$licence'"
              exit 1
            fi

            echo "Git-cloning $name ($licence) from branch $default_branch"
            destination="public/games/$folder"
            clone_tmp="$(mktemp -d)"
            cloned=false
            for attempt in 1 2 3; do
              if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone \
                --depth 1 --single-branch --branch "$default_branch" \
                "https://github.com/$name.git" "$clone_tmp/repo"; then
                cloned=true
                break
              fi
              echo "Clone attempt $attempt failed for $name; retrying..."
              rm -rf "$clone_tmp/repo"
              sleep "$((attempt * 3))"
            done
            if [ "$cloned" != true ]; then
              echo "::error::git clone failed for $name after 3 attempts"
              rm -rf "$clone_tmp"
              exit 1
            fi
            mkdir -p "$(dirname "$destination")"
            rm -rf "$destination"
            mv "$clone_tmp/repo" "$destination"
            rm -rf "$clone_tmp" "$destination/.git" "$destination/node_modules"
            find "public/games/$folder" -type f \( -name 'package.zip' -o -name '*.map' \) -delete
            find "public/games/$folder" -type d \( -name '.github' -o -name '__tests__' -o -name 'coverage' \) -prune -exec rm -rf {} +
            printf '\n- [%s](https://github.com/%s) — SPDX: %s — local copy: games/%s/\n' "$name" "$name" "$licence" "$folder" >> public/SOURCES.md
          done < <(node -e "for (const r of require('./games.json').games.filter(g=>g.verified&&g.mode==='local').map(g=>g.source).filter((v,i,a)=>a.indexOf(v)===i)) console.log(r)")


      - name: Use Node.js 24 for Sandspiel's dependency tree
        if: hashFiles('public/games/maxbittker-sandspiel/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust for Sandspiel WASM
        if: hashFiles('public/games/maxbittker-sandspiel/package.json') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Compile Sandspiel WASM and browser bundle
        if: hashFiles('public/games/maxbittker-sandspiel/package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cd public/games/maxbittker-sandspiel
          cargo install wasm-pack --locked
          yarn install --non-interactive
          node <<'NODE'
          const fs = require('fs');
          const webpackPath = 'webpack.config.js';
          let webpack = fs.readFileSync(webpackPath, 'utf8');
          webpack = webpack.replace('publicPath: "/"', 'publicPath: "./"');
          fs.writeFileSync(webpackPath, webpack);

          const appPath = 'js/app.js';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replace('<Router>', '<Router basename={window.location.pathname.slice(0, window.location.pathname.indexOf("/dist/index.html"))}>');
          fs.writeFileSync(appPath, app);

          const htmlPath = 'index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');
          html = html.replaceAll('="/assets/', '="./assets/');
          html = html.replaceAll('="/styles.css"', '="./styles.css"');
          html = html.replaceAll('="/manifest.json"', '="./manifest.json"');
          html = html.replace(/<script[^>]*googlesyndication[^>]*><\/script>/g, '');
          html = html.replace(/<script[^>]*googletagmanager[^>]*><\/script>/g, '');
          html = html.replace(/<script[^>]*a\.sandspiel\.club\/app\.js[^>]*><\/script>/g, '');
          html = html.replace(/<noscript>[\s\S]*?<\/noscript>/g, '');
          fs.writeFileSync(htmlPath, html);
          NODE
          yarn build

          # Keep only the compiled site. Webpack bundles the WASM into dist/,
          # so Rust build outputs and npm dependencies are not needed at runtime.
          rm -rf node_modules crate/target crate/pkg
          test -s dist/index.html

      - name: Restore Node.js 26 LTS for remaining build steps
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up Rust for Pong GOD CPU
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compile Rust Pong prediction engine to WebAssembly
        run: |
          set -euo pipefail
          mkdir -p public/games/jeffreyhamilton6399-arcadia/games/pong
          rustc --target wasm32-unknown-unknown --crate-type cdylib -C opt-level=3 -C panic=abort rust/pong-ai.rs -o public/games/jeffreyhamilton6399-arcadia/games/pong/pong-ai.wasm
          test -s public/games/jeffreyhamilton6399-arcadia/games/pong/pong-ai.wasm

      - name: Upgrade Pong to Rust-powered GOD CPU
        run: node scripts/improve-pong-ai.js

      - name: Fix cloned game asset paths for GitHub Pages
        run: node scripts/prepare-games.js

      - name: Index cloned repositories and generate game routes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = JSON.parse(fs.readFileSync('games.json','utf8'));
          const root = path.resolve('public');
          const routes = {};
          const imageExt = new Set(['.png','.jpg','.jpeg','.webp','.gif','.svg']);
          const textExt = new Set(['.html','.htm','.css','.js','.mjs','.json','.md','.txt','.gd','.tscn','.tres','.godot','.cfg','.rb','.yml','.yaml','.xml','.csv','.toml','.sh']);
          for (const game of manifest.games) {
            if (!game.verified || !['local','bundled'].includes(game.mode)) continue;
            let relative;
            if (game.mode === 'bundled') {
              relative = game.entrypoint;
            } else {
              const repo = game.source.match(/github\.com\/([^/]+\/[^/]+)/i)?.[1];
              if (!repo) throw new Error('Invalid GitHub source for '+game.id);
              const folder = repo.toLowerCase().replaceAll('/','-');
              const gameDir = path.resolve(root,'games',folder);
              if (game.repositoryViewer) {
                if (!fs.existsSync(gameDir) || !fs.statSync(gameDir).isDirectory()) throw new Error('Cloned repository missing for '+game.id);
                const files = [];
                function walk(dir) {
                  for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
                    if (['.git','node_modules','.godot','coverage'].includes(entry.name)) continue;
                    const full = path.join(dir,entry.name);
                    if (entry.isDirectory()) walk(full);
                    else if (entry.isFile()) {
                      const rel = path.relative(gameDir,full).split(path.sep).join('/');
                      if (rel === 'AFTERGLOW-FILES.json') continue;
                      const ext = path.extname(rel).toLowerCase();
                      files.push({path:rel,size:fs.statSync(full).size,kind:imageExt.has(ext)?'image':textExt.has(ext)?'text':'binary'});
                    }
                  }
                }
                walk(gameDir);
                files.sort((a,b)=>a.path.localeCompare(b.path));
                fs.writeFileSync(path.join(gameDir,'AFTERGLOW-FILES.json'),JSON.stringify({repository:game.source,files},null,2)+'\n');
                routes[game.id] = './repository.html?game='+encodeURIComponent(game.id);
                console.log('Indexed '+files.length+' files for '+game.title);
                continue;
              }
              relative = path.posix.join('games',folder,game.entrypoint);
            }
            if (!game.entrypoint || path.isAbsolute(game.entrypoint) || game.entrypoint.split(/[\\/]/).includes('..')) throw new Error('Unsafe entrypoint for '+game.id);
            const full = path.resolve(root,relative);
            const rel = path.relative(root,full);
            if (!rel || rel.startsWith('..') || path.isAbsolute(rel) || !fs.existsSync(full) || !fs.statSync(full).isFile()) throw new Error('Missing entrypoint for '+game.id+': '+relative);
            routes[game.id] = './'+relative;
          }
          fs.writeFileSync('public/GAME-SOURCES.json',JSON.stringify(routes,null,2)+'\n');
          fs.writeFileSync('public/games.json',JSON.stringify(manifest,null,2)+'\n');
          NODE


      - name: Verify manifest, licences, entrypoints and deployment size
        run: node scripts/verify-games.js

      - name: Sync verified game files to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-supabase-assets.js

      - name: Add source and licence credits
        run: |
          {
            echo '# Afterglow Arcade game sources'
            echo
            echo 'Locally hosted games are shallow clones of verified repositories with approved redistributable licences. Upstream licence and attribution files are retained.'
            echo
            cat public/SOURCES.md 2>/dev/null || true
            echo
            echo 'Games marked unavailable have not passed the hosting and entrypoint checks. External games link only to their official website.'
          } > public/SOURCES.md.tmp
          mv public/SOURCES.md.tmp public/SOURCES.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
