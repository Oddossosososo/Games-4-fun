<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101c"><title>Sudoku · Afterglow Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29204c,#10101c 65%);color:#f5f3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,760px);background:#191827;border:1px solid #ffffff20;border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 80px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0}p{color:#bcb7d5;margin:8px 0 16px}.tag{color:#c5a9ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}button{border:1px solid #ffffff25;background:#302b47;color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#443765}button.primary{background:#8b5cf6;border-color:#a78bfa}button:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}.stage{background:#10101b;border:1px solid #ffffff18;border-radius:16px;padding:12px;display:grid;place-items:center;min-height:300px}canvas{display:block;width:100%;max-width:620px;touch-action:none;border-radius:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#242139;border-radius:12px;padding:9px 14px;color:#c9c3e1}.stat b{color:#fff;margin-left:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#aaa3c8;margin-top:12px}.sudoku{display:grid;grid-template-columns:repeat(9,min(9vw,48px));border:2px solid #a78bfa}.sudoku input{width:min(9vw,48px);height:min(9vw,48px);min-width:0;text-align:center;border:1px solid #ffffff25;background:#25233a;color:white;font-size:20px}.sudoku input:nth-child(3n){border-right:2px solid #a78bfa}.sudoku input:nth-child(n+19):nth-child(-n+27),.sudoku input:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #a78bfa}
</style></head><body><main class="app"><header><div><div class="tag">AFTERGLOW ORIGINAL</div><h1>Sudoku</h1></div><button onclick="location.href='../../../index.html'">← Arcade</button></header><p>Self-contained game · No external assets or audio requests.</p><div class="stats" id="stats"></div><section class="stage" id="stage"><div><div class="sudoku" id="grid"></div><p id="result" style="text-align:center">Fill the empty cells, then check your solution.</p><button id="check" class="primary" style="display:block;margin:auto">Check solution</button></div></section><div class="actions"><button class="primary" id="restart">Restart</button><button id="help">How to play</button></div><div class="hint" id="hint">Enter digits 1–9. Each row, column and 3×3 square must contain every digit once.</div></main><script>const puzzle=['530070000','600195000','098000060','800060003','400803001','700020006','060000280','000419005','000080079'];let solution=['534678912','672195348','198342567','859761423','426853791','713924856','961537284','287419635','345286179'];function reset(){posted=false;grid.innerHTML='';puzzle.forEach((row,r)=>[...row].forEach((v,c)=>{let input=document.createElement('input');input.inputMode='numeric';input.maxLength=1;input.value=v==='0'?'':v;input.disabled=v!=='0';input.setAttribute('aria-label','Row '+(r+1)+' column '+(c+1));input.oninput=()=>input.value=input.value.replace(/[^1-9]/g,'').slice(0,1);grid.append(input)}));stats.innerHTML='<span class="stat">Puzzle <b>1 / 1</b></span>';result.textContent='Fill the empty cells, then check your solution.'}let posted=false;document.querySelector('#check').onclick=()=>{let vals=[...grid.querySelectorAll('input')].map(x=>x.value);let good=vals.every((v,i)=>v===solution[Math.floor(i/9)][i%9]);result.textContent=good?'Solved! Excellent work.':'Not quite yet — check the rows, columns and 3×3 squares.';if(good&&!posted){posted=true;submitScore(1)}result.style.color=good?'#86efac':'#fda4af'};document.querySelector('#restart').onclick=reset;document.querySelector('#help').onclick=()=>alert('Fill every blank cell with a digit from 1 to 9. Each row, column and 3×3 box must contain each digit once.');reset();function submitScore(value){try{const api=window.parent&&window.parent.AfterglowAPI;if(api&&Number.isFinite(value))api.submitScore("sudoku",Math.max(0,Math.floor(value))).catch(()=>{})}catch{}}
</script></body></html>
