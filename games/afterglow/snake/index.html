<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101c"><title>Snake · Afterglow Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29204c,#10101c 65%);color:#f5f3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,760px);background:#191827;border:1px solid #ffffff20;border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 80px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0}p{color:#bcb7d5;margin:8px 0 16px}.tag{color:#c5a9ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}button{border:1px solid #ffffff25;background:#302b47;color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#443765}button.primary{background:#8b5cf6;border-color:#a78bfa}button:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}.stage{background:#10101b;border:1px solid #ffffff18;border-radius:16px;padding:12px;display:grid;place-items:center;min-height:300px}canvas{display:block;width:100%;max-width:620px;touch-action:none;border-radius:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#242139;border-radius:12px;padding:9px 14px;color:#c9c3e1}.stat b{color:#fff;margin-left:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#aaa3c8;margin-top:12px}.board{display:grid;grid-template-columns:repeat(3,min(24vw,110px));gap:9px}.cell{height:min(24vw,110px);font-size:clamp(32px,9vw,58px);background:#28243c;border:1px solid #ffffff20}.cell:disabled{cursor:default;opacity:1}
</style></head><body><main class="app"><header><div><div class="tag">AFTERGLOW ORIGINAL</div><h1>Snake</h1></div><button onclick="location.href='../../index.html'">← Arcade</button></header><p>Self-contained game · No external assets or audio requests.</p><div class="stats" id="stats"></div><section class="stage" id="stage"><canvas id="game" width="600" height="600" aria-label="Snake game"></canvas></section><div class="actions"><button class="primary" id="restart">Restart</button><button id="help">How to play</button></div><div class="hint" id="hint">Arrow keys / WASD or swipe to steer.</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),stats=document.querySelector('#stats');let snake,dir,next,food,score,timer,over;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;food=spawn();score=0;over=false;stats.innerHTML='<span class="stat">Score <b id="score">0</b></span>';clearInterval(timer);timer=setInterval(tick,115);draw()}function spawn(){return{x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}function tick(){if(over)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||snake.some((p,i)=>i&&p.x===h.x&&p.y===h.y)){over=true;draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.querySelector('#score').textContent=score;food=spawn()}else snake.pop();draw()}function draw(){x.fillStyle='#111827';x.fillRect(0,0,600,600);x.strokeStyle='#20283a';for(let i=0;i<=20;i++){x.beginPath();x.moveTo(i*30,0);x.lineTo(i*30,600);x.stroke();x.beginPath();x.moveTo(0,i*30);x.lineTo(600,i*30);x.stroke()}x.fillStyle='#fb7185';x.beginPath();x.arc(food.x*30+15,food.y*30+15,11,0,7);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?'#6d5bd0':'#a78bfa';x.fillRect(p.x*30+2,p.y*30+2,26,26)});if(over){x.fillStyle='#000b';x.fillRect(0,0,600,600);x.fillStyle='white';x.textAlign='center';x.font='bold 40px system-ui';x.fillText('Game over',300,285);x.font='20px system-ui';x.fillText('Press Restart',300,325)}}document.addEventListener('keydown',e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m&&m[0]!==-dir.x&&m[1]!==-dir.y){next={x:m[0],y:m[1]};e.preventDefault()}});let tx=0,ty=0;c.addEventListener('pointerdown',e=>{tx=e.offsetX;ty=e.offsetY});c.addEventListener('pointerup',e=>{let dx=e.offsetX-tx,dy=e.offsetY-ty;if(Math.abs(dx)>Math.abs(dy))next=dx>0?{x:1,y:0}:{x:-1,y:0};else next=dy>0?{x:0,y:1}:{x:0,y:-1}});document.querySelector('#restart').onclick=reset;document.querySelector('#help').onclick=()=>alert('Use arrow keys or WASD. Swipe on touchscreens. Eat the pink food and avoid walls and your tail.');reset();</script></body></html>
