<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101c"><title>Stack Tower · Afterglow Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29204c,#10101c 65%);color:#f5f3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,760px);background:#191827;border:1px solid #ffffff20;border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 80px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0}p{color:#bcb7d5;margin:8px 0 16px}.tag{color:#c5a9ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}button{border:1px solid #ffffff25;background:#302b47;color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#443765}button.primary{background:#8b5cf6;border-color:#a78bfa}button:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}.stage{background:#10101b;border:1px solid #ffffff18;border-radius:16px;padding:12px;display:grid;place-items:center;min-height:300px}canvas{display:block;width:100%;max-width:620px;touch-action:none;border-radius:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#242139;border-radius:12px;padding:9px 14px;color:#c9c3e1}.stat b{color:#fff;margin-left:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#aaa3c8;margin-top:12px}.sudoku{display:grid;grid-template-columns:repeat(9,min(9vw,48px));border:2px solid #a78bfa}.sudoku input{width:min(9vw,48px);height:min(9vw,48px);min-width:0;text-align:center;border:1px solid #ffffff25;background:#25233a;color:white;font-size:20px}.sudoku input:nth-child(3n){border-right:2px solid #a78bfa}.sudoku input:nth-child(n+19):nth-child(-n+27),.sudoku input:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #a78bfa}
</style></head><body><main class="app"><header><div><div class="tag">AFTERGLOW ORIGINAL</div><h1>Stack Tower</h1></div><button onclick="location.href='../../../index.html'">← Arcade</button></header><p>Self-contained game · No external assets or audio requests.</p><div class="stats" id="stats"></div><section class="stage" id="stage"><canvas id="game" width="600" height="420" aria-label="Stack Tower game"></canvas></section><div class="actions"><button class="primary" id="restart">Restart</button><button id="help">How to play</button></div><div class="hint" id="hint">Click, tap or press Space to drop each moving block and stack the tower.</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let blocks,move,dir,score,over;function reset(){blocks=[{x:180,y:370,w:240,h:28}];move={x:0,y:330,w:240,h:28};dir=1;score=0;over=false;stats.innerHTML='<span class="stat">Height <b id="score">0</b></span>';draw();requestAnimationFrame(loop)}function draw(){x.fillStyle='#111827';x.fillRect(0,0,600,420);for(let b of blocks){x.fillStyle='#6752b8';x.fillRect(b.x,b.y,b.w,b.h);x.strokeStyle='#c4b5fd';x.strokeRect(b.x,b.y,b.w,b.h)}if(!over){x.fillStyle='#f0abfc';x.fillRect(move.x,move.y,move.w,move.h)}else{x.fillStyle='#0009';x.fillRect(0,0,600,420);x.fillStyle='white';x.textAlign='center';x.font='bold 36px system-ui';x.fillText('Tower complete!',300,190);x.font='20px system-ui';x.fillText('Height: '+score,300,228)}}function loop(){if(over)return;move.x+=dir*3.2;if(move.x<0||move.x+move.w>600)dir*=-1;draw();requestAnimationFrame(loop)}function drop(){if(over)return;let base=blocks[blocks.length-1],left=Math.max(base.x,move.x),right=Math.min(base.x+base.w,move.x+move.w),w=right-left;if(w<8){over=true;draw();return}blocks.push({x:left,y:move.y,w,h:28});score++;document.querySelector('#score').textContent=score;move={x:dir>0?0:600-w,y:move.y-28,w,h:28};if(move.y<30){over=true;draw()}}c.addEventListener('pointerdown',drop);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop()}});document.querySelector('#restart').onclick=reset;document.querySelector('#help').onclick=()=>alert('Tap, click or press Space to drop the moving block. Line it up with the tower to keep it wide.');reset();</script></body></html>
