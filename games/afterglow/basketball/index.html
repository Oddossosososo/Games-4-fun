<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101c"><title>Basketball · Afterglow Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29204c,#10101c 65%);color:#f5f3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,760px);background:#191827;border:1px solid #ffffff20;border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 80px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0}p{color:#bcb7d5;margin:8px 0 16px}.tag{color:#c5a9ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}button{border:1px solid #ffffff25;background:#302b47;color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#443765}button.primary{background:#8b5cf6;border-color:#a78bfa}button:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}.stage{background:#10101b;border:1px solid #ffffff18;border-radius:16px;padding:12px;display:grid;place-items:center;min-height:300px}canvas{display:block;width:100%;max-width:620px;touch-action:none;border-radius:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#242139;border-radius:12px;padding:9px 14px;color:#c9c3e1}.stat b{color:#fff;margin-left:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#aaa3c8;margin-top:12px}.board{display:grid;grid-template-columns:repeat(3,min(24vw,110px));gap:9px}.cell{height:min(24vw,110px);font-size:clamp(32px,9vw,58px);background:#28243c;border:1px solid #ffffff20}.cell:disabled{cursor:default;opacity:1}
</style></head><body><main class="app"><header><div><div class="tag">AFTERGLOW ORIGINAL</div><h1>Basketball</h1></div><button onclick="location.href='../../../index.html'">← Arcade</button></header><p>Self-contained game · No external assets or audio requests.</p><div class="stats" id="stats"></div><section class="stage" id="stage"><canvas id="game" width="600" height="440" aria-label="Basketball game"></canvas></section><div class="actions"><button class="primary" id="restart">Restart</button><button id="help">How to play</button></div><div class="hint" id="hint">Drag from the ball to aim, then release to shoot.</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let ball,score,shots,aim,drag,done;function reset(){ball={x:110,y:320,vx:0,vy:0,r:17};score=0;shots=0;aim=null;drag=false;done=false;stats.innerHTML='<span class="stat">Score <b id="score">0</b></span><span class="stat">Shots <b id="shots">0</b></span>';draw()}function draw(){x.fillStyle='#17243b';x.fillRect(0,0,600,440);x.fillStyle='#243c55';x.fillRect(0,350,600,90);x.strokeStyle='#f8fafc';x.lineWidth=7;x.beginPath();x.moveTo(475,120);x.lineTo(475,240);x.lineTo(550,240);x.stroke();x.strokeStyle='#fb923c';x.lineWidth=8;x.beginPath();x.ellipse(520,240,42,9,0,0,Math.PI*2);x.stroke();x.fillStyle='#fb923c';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.strokeStyle='#7c2d12';x.lineWidth=2;x.beginPath();x.moveTo(ball.x-15,ball.y);x.lineTo(ball.x+15,ball.y);x.moveTo(ball.x,ball.y-15);x.lineTo(ball.x,ball.y+15);x.stroke();if(aim){x.strokeStyle='#c4b5fd';x.setLineDash([7,7]);x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(aim.x,aim.y);x.stroke();x.setLineDash([])}}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*440/r.height}}c.onpointerdown=e=>{if(ball.vx||ball.vy)return;drag=true;aim=point(e);c.setPointerCapture(e.pointerId);draw()};c.onpointermove=e=>{if(drag){aim=point(e);draw()}};c.onpointerup=e=>{if(!drag)return;drag=false;let p=point(e);ball.vx=Math.max(-18,Math.min(18,(ball.x-p.x)*.09));ball.vy=Math.max(-22,Math.min(8,(ball.y-p.y)*.09));shots++;document.querySelector('#shots').textContent=shots;aim=null;requestAnimationFrame(loop)};function loop(){if(ball.vx||ball.vy){let old=ball.x;ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.38;ball.vx*=.995;if(old<520&&ball.x>=478&&ball.y>225&&ball.y<265&&ball.vx>0){}if(ball.y>220&&ball.y<258&&ball.x>478&&ball.x<562&&Math.abs(ball.vy)<7&&ball.vx>0){score++;document.querySelector('#score').textContent=score;ball.vx=ball.vy=0}if(ball.y>440||ball.x>620||ball.x<0){ball={x:110,y:320,vx:0,vy:0,r:17}}draw();if(ball.vx||ball.vy)requestAnimationFrame(loop)}else draw()}document.querySelector('#restart').onclick=reset;document.querySelector('#help').onclick=()=>alert('Drag backwards from the ball to aim, then release to shoot. Try to send the ball through the orange hoop.');reset();</script></body></html>
