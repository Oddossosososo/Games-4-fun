<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101c"><title>Bubble Pop · Afterglow Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29204c,#10101c 65%);color:#f5f3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,760px);background:#191827;border:1px solid #ffffff20;border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 80px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0}p{color:#bcb7d5;margin:8px 0 16px}.tag{color:#c5a9ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}button{border:1px solid #ffffff25;background:#302b47;color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#443765}button.primary{background:#8b5cf6;border-color:#a78bfa}button:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}.stage{background:#10101b;border:1px solid #ffffff18;border-radius:16px;padding:12px;display:grid;place-items:center;min-height:300px}canvas{display:block;width:100%;max-width:620px;touch-action:none;border-radius:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#242139;border-radius:12px;padding:9px 14px;color:#c9c3e1}.stat b{color:#fff;margin-left:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#aaa3c8;margin-top:12px}.board{display:grid;grid-template-columns:repeat(3,min(24vw,110px));gap:9px}.cell{height:min(24vw,110px);font-size:clamp(32px,9vw,58px);background:#28243c;border:1px solid #ffffff20}.cell:disabled{cursor:default;opacity:1}
</style></head><body><main class="app"><header><div><div class="tag">AFTERGLOW ORIGINAL</div><h1>Bubble Pop</h1></div><button onclick="location.href='../../../index.html'">← Arcade</button></header><p>Self-contained game · No external assets or audio requests.</p><div class="stats" id="stats"></div><section class="stage" id="stage"><canvas id="game" width="600" height="500" aria-label="Bubble Pop game"></canvas></section><div class="actions"><button class="primary" id="restart">Restart</button><button id="help">How to play</button></div><div class="hint" id="hint">Tap bubbles before they float away.</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let bubbles,score,time,last,playing;function reset(){bubbles=[];score=0;time=45;last=0;playing=true;stats.innerHTML='<span class="stat">Popped <b id="score">0</b></span><span class="stat">Time <b id="time">45</b>s</span>';draw();requestAnimationFrame(loop)}function spawn(){let r=16+Math.random()*22;bubbles.push({x:r+Math.random()*(600-2*r),y:510+r,r,vy:1.1+Math.random()*1.8,h:Math.random()*360})}function draw(){x.fillStyle='#10283b';x.fillRect(0,0,600,500);for(let b of bubbles){x.fillStyle='hsla('+b.h+',85%,65%,.82)';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.strokeStyle='#ffffffaa';x.lineWidth=3;x.beginPath();x.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.45,Math.PI,Math.PI*1.5);x.stroke()}if(!playing){x.fillStyle='#0009';x.fillRect(0,0,600,500);x.fillStyle='white';x.textAlign='center';x.font='bold 36px system-ui';x.fillText('Time up!',300,240);x.font='20px system-ui';x.fillText('Final score: '+score,300,280)}}function loop(t){if(!playing)return;if(t-last>650){spawn();last=t}bubbles.forEach(b=>b.y-=b.vy);bubbles=bubbles.filter(b=>b.y>-50);if(Math.floor(t/1000)!==Math.floor((t-16)/1000)){time--;document.querySelector('#time').textContent=time;if(time<=0){playing=false;submitScore(score);draw();return}}draw();requestAnimationFrame(loop)}c.onpointerdown=e=>{if(!playing)return;let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*600/r.width,py=(e.clientY-r.top)*500/r.height;let i=bubbles.findIndex(b=>Math.hypot(b.x-px,b.y-py)<b.r+4);if(i>=0){bubbles.splice(i,1);score++;document.querySelector('#score').textContent=score;draw()}};document.querySelector('#restart').onclick=reset;document.querySelector('#help').onclick=()=>alert('Tap or click the bubbles before they float off the top. You have 45 seconds.');reset();function submitScore(value){try{const api=window.parent&&window.parent.AfterglowAPI;if(api&&Number.isFinite(value))api.submitScore("bubble-pop",Math.max(0,Math.floor(value))).catch(()=>{})}catch{}}
</script></body></html>
