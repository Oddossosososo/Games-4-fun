<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101c"><title>Bowling · Afterglow Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29204c,#10101c 65%);color:#f5f3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,760px);background:#191827;border:1px solid #ffffff20;border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 80px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0}p{color:#bcb7d5;margin:8px 0 16px}.tag{color:#c5a9ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}button{border:1px solid #ffffff25;background:#302b47;color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#443765}button.primary{background:#8b5cf6;border-color:#a78bfa}button:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}.stage{background:#10101b;border:1px solid #ffffff18;border-radius:16px;padding:12px;display:grid;place-items:center;min-height:300px}canvas{display:block;width:100%;max-width:620px;touch-action:none;border-radius:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#242139;border-radius:12px;padding:9px 14px;color:#c9c3e1}.stat b{color:#fff;margin-left:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#aaa3c8;margin-top:12px}.sudoku{display:grid;grid-template-columns:repeat(9,min(9vw,48px));border:2px solid #a78bfa}.sudoku input{width:min(9vw,48px);height:min(9vw,48px);min-width:0;text-align:center;border:1px solid #ffffff25;background:#25233a;color:white;font-size:20px}.sudoku input:nth-child(3n){border-right:2px solid #a78bfa}.sudoku input:nth-child(n+19):nth-child(-n+27),.sudoku input:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #a78bfa}
</style></head><body><main class="app"><header><div><div class="tag">AFTERGLOW ORIGINAL</div><h1>Bowling</h1></div><button onclick="location.href='../../../index.html'">← Arcade</button></header><p>Self-contained game · No external assets or audio requests.</p><div class="stats" id="stats"></div><section class="stage" id="stage"><canvas id="game" width="600" height="440" aria-label="Bowling game"></canvas></section><div class="actions"><button class="primary" id="restart">Restart</button><button id="help">How to play</button></div><div class="hint" id="hint">Drag from the ball toward the pins to set direction and power, then release.</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let ball,pins,score,throws,aim,moving;function reset(){if(score>0)submitScore(score);ball={x:300,y:380,vx:0,vy:0};pins=[];for(let r=0;r<4;r++)for(let k=0;k<=r;k++)pins.push({x:300+(k-r/2)*34,y:105+r*34,up:true});score=0;throws=0;aim=null;moving=false;stats.innerHTML='<span class="stat">Pins <b id="score">0</b></span><span class="stat">Throws <b id="throws">0</b></span>';draw()}function draw(){x.fillStyle='#17283c';x.fillRect(0,0,600,440);x.fillStyle='#b18b61';x.fillRect(110,40,380,390);x.fillStyle='#d6b58a';x.fillRect(125,45,350,385);x.fillStyle='#fff';pins.forEach(p=>{if(p.up){x.beginPath();x.ellipse(p.x,p.y,9,17,0,0,7);x.fill()}});x.fillStyle='#a78bfa';x.beginPath();x.arc(ball.x,ball.y,16,0,7);x.fill();if(aim){x.strokeStyle='#6d28d9';x.lineWidth=4;x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(aim.x,aim.y);x.stroke()}}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*440/r.height}}c.onpointerdown=e=>{if(moving)return;aim=pos(e);c.setPointerCapture(e.pointerId);draw()};c.onpointermove=e=>{if(aim){aim=pos(e);draw()}};c.onpointerup=e=>{if(!aim)return;let p=pos(e),dx=p.x-ball.x,dy=p.y-ball.y;let mag=Math.hypot(dx,dy)||1;ball.vx=dx/mag*Math.min(17,mag*.055);ball.vy=dy/mag*Math.min(22,mag*.07);moving=true;aim=null;throws++;document.querySelector('#throws').textContent=throws;requestAnimationFrame(loop)};function loop(){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.985;ball.vy*=.985;for(let p of pins)if(p.up&&Math.hypot(p.x-ball.x,p.y-ball.y)<26){p.up=false;score++;document.querySelector('#score').textContent=score}draw();if(Math.hypot(ball.vx,ball.vy)>.5&&ball.y>25&&ball.y<445)requestAnimationFrame(loop);else{moving=false;ball={x:300,y:380,vx:0,vy:0};draw()}}document.querySelector('#restart').onclick=reset;document.querySelector('#help').onclick=()=>alert('Drag from the ball toward the pins. The direction and length of your drag set the shot.');reset();function submitScore(value){try{const api=window.parent&&window.parent.AfterglowAPI;if(api&&Number.isFinite(value))api.submitScore("bowling",Math.max(0,Math.floor(value))).catch(()=>{})}catch{}}
</script></body></html>
