<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101c"><title>Table Tennis · Afterglow Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29204c,#10101c 65%);color:#f5f3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,760px);background:#191827;border:1px solid #ffffff20;border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 80px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0}p{color:#bcb7d5;margin:8px 0 16px}.tag{color:#c5a9ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}button{border:1px solid #ffffff25;background:#302b47;color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#443765}button.primary{background:#8b5cf6;border-color:#a78bfa}button:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}.stage{background:#10101b;border:1px solid #ffffff18;border-radius:16px;padding:12px;display:grid;place-items:center;min-height:300px}canvas{display:block;width:100%;max-width:620px;touch-action:none;border-radius:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#242139;border-radius:12px;padding:9px 14px;color:#c9c3e1}.stat b{color:#fff;margin-left:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#aaa3c8;margin-top:12px}.board{display:grid;grid-template-columns:repeat(3,min(24vw,110px));gap:9px}.cell{height:min(24vw,110px);font-size:clamp(32px,9vw,58px);background:#28243c;border:1px solid #ffffff20}.cell:disabled{cursor:default;opacity:1}
</style></head><body><main class="app"><header><div><div class="tag">AFTERGLOW ORIGINAL</div><h1>Table Tennis</h1></div><button onclick="location.href='../../index.html'">← Arcade</button></header><p>Self-contained game · No external assets or audio requests.</p><div class="stats" id="stats"></div><section class="stage" id="stage"><canvas id="game" width="600" height="420" aria-label="Table tennis game"></canvas></section><div class="actions"><button class="primary" id="restart">Restart</button><button id="help">How to play</button></div><div class="hint" id="hint">Move with W/S or arrow keys; touch controls work too.</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let py,ey,b,score,ai,keys={};function reset(){py=170;ey=170;b={x:300,y:210,vx:5,vy:2.4};score=0;ai=0;stats.innerHTML='<span class="stat">You <b id="score">0</b></span><span class="stat">Computer <b id="ai">0</b></span>';draw()}function draw(){x.fillStyle='#123d37';x.fillRect(0,0,600,420);x.strokeStyle='#ffffff80';x.setLineDash([10,10]);x.beginPath();x.moveTo(300,0);x.lineTo(300,420);x.stroke();x.setLineDash([]);x.fillStyle='#e9d5ff';x.fillRect(22,py,13,90);x.fillRect(565,ey,13,90);x.fillStyle='#fb923c';x.beginPath();x.arc(b.x,b.y,10,0,7);x.fill()}function loop(){if(keys.ArrowUp||keys.w)py-=7;if(keys.ArrowDown||keys.s)py+=7;py=Math.max(0,Math.min(330,py));ey+=(b.y-45-ey)*.055;ey=Math.max(0,Math.min(330,ey));b.x+=b.vx;b.y+=b.vy;if(b.y<10||b.y>410)b.vy*=-1;if(b.x<48&&b.x>30&&b.y>py-5&&b.y<py+95){b.vx=Math.abs(b.vx)*1.04;b.vy+=(b.y-(py+45))*.07}if(b.x>552&&b.x<570&&b.y>ey-5&&b.y<ey+95){b.vx=-Math.abs(b.vx)*1.04;b.vy+=(b.y-(ey+45))*.07}if(b.x<0){ai++;document.querySelector('#ai').textContent=ai;serve(-1)}if(b.x>600){score++;document.querySelector('#score').textContent=score;serve(1)}draw();requestAnimationFrame(loop)}function serve(d){b={x:300,y:210,vx:5*d,vy:(Math.random()-.5)*5}}document.onkeydown=e=>{keys[e.key]=true};document.onkeyup=e=>{keys[e.key]=false};c.onpointermove=e=>{let r=c.getBoundingClientRect();py=Math.max(0,Math.min(330,(e.clientY-r.top)*420/r.height-45))};document.querySelector('#restart').onclick=reset;document.querySelector('#help').onclick=()=>alert('Move your paddle with W/S or ↑/↓. On touch, move your finger up and down over the court.');reset();requestAnimationFrame(loop);</script></body></html>
