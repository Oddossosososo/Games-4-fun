<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101c"><title>Tic-Tac-Toe · Afterglow Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29204c,#10101c 65%);color:#f5f3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,760px);background:#191827;border:1px solid #ffffff20;border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 24px 80px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0}p{color:#bcb7d5;margin:8px 0 16px}.tag{color:#c5a9ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}button{border:1px solid #ffffff25;background:#302b47;color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#443765}button.primary{background:#8b5cf6;border-color:#a78bfa}button:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}.stage{background:#10101b;border:1px solid #ffffff18;border-radius:16px;padding:12px;display:grid;place-items:center;min-height:300px}canvas{display:block;width:100%;max-width:620px;touch-action:none;border-radius:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:#242139;border-radius:12px;padding:9px 14px;color:#c9c3e1}.stat b{color:#fff;margin-left:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#aaa3c8;margin-top:12px}.board{display:grid;grid-template-columns:repeat(3,min(24vw,110px));gap:9px}.cell{height:min(24vw,110px);font-size:clamp(32px,9vw,58px);background:#28243c;border:1px solid #ffffff20}.cell:disabled{cursor:default;opacity:1}
</style></head><body><main class="app"><header><div><div class="tag">AFTERGLOW ORIGINAL</div><h1>Tic-Tac-Toe</h1></div><button onclick="location.href='../../../index.html'">← Arcade</button></header><p>Self-contained game · No external assets or audio requests.</p><div class="stats" id="stats"></div><section class="stage" id="stage"><div><div class="board" id="board"></div><p id="message" style="text-align:center;margin:16px 0 0;color:#fff">Your turn · X</p><div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button id="mode">Mode: vs computer</button></div></div></section><div class="actions"><button class="primary" id="restart">Restart</button><button id="help">How to play</button></div><div class="hint" id="hint">Get three in a row. Play against the computer or a friend.</div></main><script>const board=document.querySelector('#board'),msg=document.querySelector('#message'),mode=document.querySelector('#mode');let cells,turn,done,two=false;function reset(){cells=Array(9).fill('');turn='X';done=false;render()}function winner(a){for(let l of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(a[l[0]]&&a[l[0]]===a[l[1]]&&a[l[1]]===a[l[2]])return a[l[0]];return a.every(Boolean)?'draw':null}function best(){let empty=cells.map((v,i)=>v?null:i).filter(v=>v!==null);let win=empty.find(i=>{let a=[...cells];a[i]='O';return winner(a)==='O'});if(win!==undefined)return win;let block=empty.find(i=>{let a=[...cells];a[i]='X';return winner(a)==='X'});if(block!==undefined)return block;return empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)]}function play(i){if(done||cells[i])return;cells[i]=turn;let w=winner(cells);if(w){done=true;render();if(w==='X')submitScore(1);return}turn=turn==='X'?'O':'X';if(!two&&turn==='O'){cells[best()]='O';w=winner(cells);if(w)done=true;else turn='X'}render()}function render(){board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='cell';b.textContent=v;b.disabled=!!v||done;b.onclick=()=>play(i);board.append(b)});let w=winner(cells);msg.textContent=w?(w==='draw'?'It is a draw!':w+' wins!'):('Your turn · '+turn)}mode.onclick=()=>{two=!two;mode.textContent='Mode: '+(two?'2 players':'vs computer');reset()};document.querySelector('#restart').onclick=reset;document.querySelector('#help').onclick=()=>alert('Get three in a row. In computer mode, you play X against the computer.');reset();function submitScore(value){try{const api=window.parent&&window.parent.AfterglowAPI;if(api&&Number.isFinite(value))api.submitScore("tic-tac-toe",Math.max(0,Math.floor(value))).catch(()=>{})}catch{}}
</script></body></html>
